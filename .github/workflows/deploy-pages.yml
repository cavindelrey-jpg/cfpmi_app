name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # OPTIONAL: If your project requires a build step (like React, Vue, or Next.js), 
      # uncomment the lines below and adjust the command:
      # - name: Build Project
      #   run: npm install && npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=cfpmi
          # NOTE: If you have a build step, change the "." above to your build output directory (e.g., dist, build, or .next)

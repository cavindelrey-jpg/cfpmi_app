name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One live deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get

      # base-href must match the Pages sub-path (/cfpmi_app/) or every asset
      # 404s and the page renders blank — the exact symptom we are fixing.
      - name: Build web (CFPMI, Pages base-href)
        run: flutter build web --release --dart-define=BRAND_ID=cfpmi --base-href /cfpmi_app/

      # SPA fallback: GitHub Pages has no rewrite, so a refresh on a deep
      # route would 404. Serving index.html as 404.html makes every path
      # load the app (Flutter then routes client-side).
      - name: SPA 404 fallback
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

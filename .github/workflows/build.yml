name: CFPMI CI (test then build)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── 1. Tests run first. If they fail, the build job below never runs. ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run flutter test
        run: flutter test

  # ── 2. Build only after tests pass (needs: test). ──
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (CFPMI)
        run: |
          flutter build web --release --dart-define=BRAND_ID=cfpmi
          cp web/_redirects build/web/_redirects 2>/dev/null || true

      - name: Upload web build (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cfpmi-web
          path: build/web
          retention-days: 7

      # ── Deploy the web build to Cloudflare Pages (production).
      # Sanitizes whitespace/newlines from repo secrets before invoking wrangler.
      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN_RAW" ]; then
            echo "Cloudflare token not configured. Skipping deploy."
            exit 0
          fi
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" | tr -d '\r\n[:space:]')
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '\r\n[:space:]')
          npx --yes wrangler@latest pages deploy build/web --project-name=cfpmi --branch=main --commit-dirty=true

      - name: Build Android APK (CFPMI)
        run: flutter build apk --release --flavor cfpmi --dart-define=BRAND_ID=cfpmi --target-platform android-arm64

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cfpmi-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      # ── Android App Bundle (.aab) — the artifact uploaded to Google Play.
      # Signed with the committed upload key (android/key.properties +
      # android/app/upload-keystore.jks); applicationId com.cfpmi.app.
      - name: Build Android App Bundle (AAB, CFPMI)
        # arm64 only — keeps the .aab well under 100 MB (drops the
        # armeabi-v7a + x86_64 engine libs). Covers modern Android devices.
        run: flutter build appbundle --release --flavor cfpmi --dart-define=BRAND_ID=cfpmi --target-platform android-arm64

      - name: Upload AAB (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cfpmi-release-aab
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 14

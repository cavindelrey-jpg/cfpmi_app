name: CFPMI CI (test then build)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ── 1. Tests run first. If they fail, the build job below never runs. ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run flutter test
        run: flutter test

  # ── 2. Build only after tests pass (needs: test). ──
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build web (CFPMI)
        run: flutter build web --release --dart-define=BRAND_ID=cfpmi

      - name: Upload web build (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cfpmi-web
          path: build/web
          retention-days: 7

      # ── Deploy the web build to Cloudflare Pages (production).
      # Auto-publishes on every push to main. Requires three one-time setup
      # steps by the account owner (see docs/CLOUDFLARE_DEPLOY.md):
      #   1. Create a Cloudflare Pages project named "cfpmi" (Direct Upload).
      #   2. Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
      #   3. Add the custom domain cfpmischools.com to that Pages project.
      # continue-on-error so the pipeline still succeeds before secrets exist.
      - name: Deploy to Cloudflare Pages
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=cfpmi --branch=main --commit-dirty=true

      - name: Build Android APK (CFPMI)
        run: flutter build apk --release --flavor cfpmi --dart-define=BRAND_ID=cfpmi --target-platform android-arm64

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cfpmi-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      # ── Android App Bundle (.aab) — the artifact uploaded to Google Play.
      # Signed with the committed upload key (android/key.properties +
      # android/app/upload-keystore.jks); applicationId com.cfpmi.app.
      - name: Build Android App Bundle (AAB, CFPMI)
        # arm64 only — keeps the .aab well under 100 MB (drops the
        # armeabi-v7a + x86_64 engine libs). Covers modern Android devices.
        run: flutter build appbundle --release --flavor cfpmi --dart-define=BRAND_ID=cfpmi --target-platform android-arm64

      - name: Upload AAB (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: cfpmi-release-aab
          path: build/app/outputs/bundle/**/*.aab
          retention-days: 14
